# Deploy the Ledger Odyssey web app to GitHub Pages.
#
# Pages *project* site: the repository is served from
# https://<owner>.github.io/<repo>/ and every asset needs that prefix. The
# build below derives VITE_BASE from the repository name, which
# vite.config.ts reads, so the base path can never drift from the repo name
# (and stays correct if the repo is renamed, or if the site is ever published
# as a user/org page at the root). Adapted from the Talon deploy workflow.
#
# The repository's Pages source must be "GitHub Actions" (Settings > Pages >
# Build and deployment > Source). If it is left on "Deploy from a branch",
# GitHub publishes the raw repository through Jekyll instead and this workflow
# fails at the configure-pages step. `enablement: true` lets that step switch
# the source to Actions by itself when the token has the pages: write scope.
#
# Only web changes trigger a deploy; the Python pipeline is covered by ci.yml
# and the scripts tests.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "tailwind.config.js"
      - "postcss.config.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, so a misconfigured Pages source fails before the build runs.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Project pages live under /<repo>/; a user/org <name>.github.io page
        # is served from the root instead. The configure-pages base_path
        # reaches the script only through env, never interpolated into the
        # shell block (script injection pattern, docs/reviews.md).
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "Building for ${base} (Pages environment: ${PAGES_BASE_PATH})"
          VITE_BASE="$base" npm run build

      - name: Confirm the built asset paths carry the base
        run: |
          grep -q "$(basename "$GITHUB_REPOSITORY")/assets/" dist/index.html \
            || { echo "dist/index.html does not reference the base-prefixed assets"; grep -o 'src="[^"]*"' dist/index.html; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
