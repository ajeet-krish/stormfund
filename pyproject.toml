# Offline data pipeline for Ledger Odyssey (Sheridan Datathon 2026).
# Dependencies are pinned exactly; uv.lock is committed alongside this file.

[project]
name = "sheridan-datathon-pipeline"
version = "0.1.0"
description = "Offline CSV to public/data JSON builders for the Ledger Odyssey game"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
